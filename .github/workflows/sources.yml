# Manual check that every source answers from a GitHub runner (datacenter IPs get treated
# differently by some sites). Results appear in the run summary.

name: Check sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Fetch every source once
        run: |
          set -o pipefail
          uv run --locked python -m newsroom sources | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
