# The 403 Times: generate the daily edition and publish the site to GitHub Pages.
#
# - schedule: a check every 15 minutes (:05/:20/:35/:50; :50 is just after the 07:45 slot); config.yaml
#   (schedule.editions, Stockholm time) decides whether an edition is due, so runs that find nothing to do
#   finish in seconds. GitHub delays and drops scheduled runs (14 of the first 16 hourly ticks never ran,
#   including the 07:50 one on 2026-11-04); any later tick catches up, so more ticks = fewer missed mornings.
#   The repo is public, so the extra runs cost no Actions minutes.
# - workflow_dispatch: "Run workflow" button; any mode other than auto forces a run now.
# - push to main (code, templates, config): re-render and redeploy without a new edition.
# Pushes made with GITHUB_TOKEN (the data commits below) don't trigger workflows, so no loops.

name: Edition

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto follows the schedule; the others force a run now"
        type: choice
        options: [auto, full, reduced, links, skip]
        default: auto
  push:
    branches: [main]
    paths:
      - "newsroom/**"
      - "templates/**"
      - "static/**"
      - "config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/edition.yml"

permissions:
  contents: read

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # commit data/
      actions: write           # keep-alive: re-enable this workflow (60-day inactivity rule)
    outputs:
      published: ${{ steps.gen.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - id: gen
        name: Generate the edition (if due)
        run: uv run --locked python -m newsroom generate --mode "$MODE"
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}

      - name: Commit the edition
        if: steps.gen.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Edition ${{ steps.gen.outputs.edition_id }} (${{ steps.gen.outputs.mode }})"
          git push || (git pull --rebase && git push)

      - name: Keep the schedule alive
        if: steps.gen.outputs.mode != 'none'     # once per edition slot, not every hour
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/edition.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: generate
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.generate.outputs.published == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main              # includes the edition just committed by the generate job
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Test
        run: uv run --locked pytest -q
      - name: Render
        run: uv run --locked python -m newsroom render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
