# The 403 Times: every tuning knob lives here.
# search.depth and search.discovery_every_days arrive with discovery (phase 5); everything else is live.

site:
  title: "The 403 Times"
  tagline: "Access Granted"
  description: "A personal AI newspaper: AI, tech, PC gaming and deals, written by Claude from the linked sources."
  url: "https://a403.space/times/"
  base_path: "/times/"
  language: en
  images:
    news_preview_images: false        # news stories use typographic covers; games/videos use store/YouTube art

schedule:
  timezone: "Europe/Stockholm"
  editions: ["07:00"]                 # one morning edition; add slots for more

sections:
  - { slug: ai,     name: AI,     blurb: "Models, research, tools and the policy that matters." }
  - { slug: tech,   name: Tech,   blurb: "Developer news, open source, security and hardware." }
  - { slug: gaming, name: Gaming, blurb: "PC first. Consoles when it's big." }
  - { slug: deals,  name: Deals,  blurb: "Shopping advice, not ads." }

edition:
  featured: { min: 1, max: 3,   words: 350, max_sources: 3, min_newsworthiness: 4.5 }
  medium:   { min: 3, max: 6,   words: 130, min_newsworthiness: 3.5 }
  briefs:   { min: 10, max: 20, words: 35,  min_newsworthiness: 2.5 }
  # min is a soft target: the editor goes below it rather than print weak stories (featured always ≥ 1)

gaming:
  new_on_pc:         { min: 3, max: 9, window_days: 7, min_reviews: 50 }     # Steam user reviews = popularity
  reviews:           { min: 3, max: 10, window_days: 7, fill_days: 14, per_game: 2 }   # quiet days: fill from 14 days
  console_spotlight:
    max: 3
    min_notability: 4.5
    watch: ["GTA 6", "GTA VI", "Grand Theft Auto VI", "Ocarina of Time"]   # links edition: rule-based spotlight
  coming_soon:       { max: 8, horizon_days: 180 }                          # Steam's most-wishlisted, by date
  watch:             { max: 4, window_days: 7 }
  news:              { max: 6 }

deals:
  country: SE
  featured: { min: 1, max: 2 }
  more:     { min: 5, max: 10 }
  min_cut_pct: 50
  near_low_pct: 10                    # within 10% of the lowest price ever
  min_steam_rating: "Very Positive"
  mix: { popular: 5, hidden: 3, genre: 2 }   # where "more" comes from (ITAD); genres take turns by day

search:
  depth: light                        # off | light | normal | deep (discovery isn't in the edition yet: phase 5)
  discovery_every_days: 1
  depths:                             # per discovery run; finds = the most kept. Measure: python -m newsroom discover
    light:  { searches: 3,  fetches: 3,  finds: 4 }
    normal: { searches: 6,  fetches: 5,  finds: 6 }
    deep:   { searches: 12, fetches: 10, finds: 10 }
  fetch_tokens: 6000                  # cap on each fetched page in Claude's context
  candidates_scored: 300
  max_item_age_hours: 36
  max_fulltext_chars: 12000

models:
  triage:   claude-haiku-5-5
  editor:   claude-opus-5-5
  featured: claude-opus-5-5
  medium:   claude-opus-5-5
  briefs:   claude-opus-5-5
  gaming:   claude-opus-5-5
  deals:    claude-opus-5-5
  discover: claude-opus-5-5
  probe:    claude-haiku-5-5
  opinion_pick: claude-opus-5-5       # the opinion editor picks the column's topic
  opinion:  claude-fable-5-1          # the columnist writes it
  opinion_check: claude-opus-5-5      # the copy desk fact-checks it against the stories
  quiz:     claude-opus-5-5           # the quiz editor writes the questions
  quiz_check: claude-opus-5-5         # the copy desk checks each answer against its story

budget:
  monthly_usd: 35                     # paced over the calendar month; the Console workspace spend limit is $40
  pace_allowance_usd: 2
  per_run_usd: 1.25
  when_over_pace: reduced             # reduced | links | skip

llm:
  when_unavailable: links             # links | skip
  backend: api                        # api | claude-code (local development only: runs `claude -p` on your
                                      #   Claude subscription; refused in GitHub Actions). Also: --llm, $NEWSROOM_LLM
  parallel: 3                         # Claude calls at once
  max_candidates: 150                 # rule-ranked items sent to triage
  triage_chunk: 40                    # items per triage call (structured output from Haiku runs ~1 token per character)
  timeout_seconds: 240
  reduced: { featured_max: 1, medium_max: 3 }
  max_tokens: { triage: 16000, editor: 4000, featured: 3000, medium: 1500, briefs: 5000, gaming: 5000, deals: 4000,
                opinion_pick: 8000, opinion: 16000, opinion_check: 8000, quiz: 12000, quiz_check: 8000,
                discover: 12000 }
                                      # a hard cap on thinking + text (Claude 5 models always think); you pay for what's used
  effort: { opinion_pick: high, opinion: high, opinion_check: high, quiz_check: high }
                                      # per task; unset = the model's default (Opus 5.5: medium, Fable 5.1: high)

opinion:                              # the opinion column: Opus picks a topic, Fable writes it, Opus fact-checks it
  enabled: true
  days: [wed, sun]                    # weekdays it can run (mon … sun), only in full editions
  every_weeks: 1                      # 1 = every listed day, every week; 2 = every other week
  words: 800
  lookback_days: 7                    # the editions a topic is picked from
  front_days: 7                       # how long the latest column stays on the front page

quiz:                                 # the news quiz: Opus writes multiple-choice questions on the news since the
  enabled: true                       #   last quiz, and Opus checks each one against its story
  days: [tue, sat]                    # twice a week, on days without an opinion column (opinion.days); full editions only
  every_weeks: 1
  questions: 8
  min_questions: 5                    # fewer pass the check: no quiz this time
  max_per_section: 4
  lookback_days: 7                    # at most; normally the days since the last quiz
  front_days: 4                       # how long the latest quiz stays on the front page

weather:                              # today's front page: Open-Meteo, no key, fetched live in the reader's browser
  enabled: true                       # (static/weather.js); "Use my location" swaps the place for theirs
  place: Stockholm                    # until then
  latitude: 59.33
  longitude: 18.07
  hours: [9, 12, 15, 18]              # the "later today" strip, local time (only hours still ahead are shown)
  days: 2                             # days after today

links:                                # the no-AI links edition
  per_section: 12                     # AI and Tech headline lists
  max_per_source: 4                   # per section, so one busy feed can't fill it
  hn_top: 10
  languages: [en]                     # headlines in other languages only feed reviews (and AI modes)

interests: |
  AI: model releases, research that matters, AI developer tools and agents, policy with real impact.
      Skip hype, listicles and routine funding news.
  Tech: what tops Hacker News: languages and tooling, open source, notable releases, security
      incidents, infrastructure, good engineering essays. Major hardware news (CPUs, GPUs, PC parts).
      Skip buying guides and affiliate roundups.
  Gaming: PC first: notable new PC games and how reviewers received them. Consoles only for the
      biggest releases (GTA VI-class). Indie gems. Significant industry news. Skip rumors.
  Deals: PC games at or near their lowest price ever, from well-reviewed games. Shopping advice, not ads.

sources:
  # weight scales a source's headlines in the rule-based ranking (1.0 = normal)
  # skip_categories matches a feed item's first category; skip_paths matches its URL (keep_paths wins)
  # reviews: kind: reviews (every item) or reviews_url (matching URLs); reviews_only drops the rest;
  # score_from_page reads the score from the review page; score_scale turns "Score: 9.25" into 9.25/10;
  # multi_platform outlets also review console games: a game IsThereAnyDeal lists as console-only is dropped
  hackernews: { front_page: true, min_points: 100 }
  feeds:
    - { name: Ars Technica,  url: "https://feeds.arstechnica.com/arstechnica/index", sections: [ai, tech], weight: 1.1,
        skip_categories: [Science, Space, Cars, Health, Culture] }
    - { name: TechRadar,     url: "https://www.techradar.com/feeds.xml", sections: [ai, tech], weight: 0.8,
        skip_paths: [/seasonal-sales/, /deals/, /best/, /vpn/, /entertainment/, /home/, /health-fitness/,
                     /audio/, /pro/], keep_paths: [/pro/security/] }       # TechRadar Pro is mostly B2B columns
    - { name: Tom's Hardware, url: "https://www.tomshardware.com/feeds.xml", sections: [tech], weight: 1.0,
        skip_paths: [/deals/, /best-picks/] }
    - { name: MISSIL,        url: "https://www.missil.se/feed/", sections: [gaming], language: sv,
        reviews_url: "/spelrecensioner/", title_is_game: true, multi_platform: true,
        skip_categories: [FILMNYHET, Petters blogg], skip_paths: [/retro/] }   # MISSIL Retro: old games
    - { name: MISSIL Reviews, url: "https://missil.se/spelrecensioner/feed/", sections: [gaming], language: sv,
        kind: reviews, title_is_game: true, reviews_only: true, multi_platform: true }   # the main feed has 15 items
    - { name: PC Gamer,      url: "https://www.pcgamer.com/feeds.xml", sections: [gaming, tech],
        reviews_url: "-review/?$", score_from_page: true, skip_paths: [/deals/] }
    - { name: PC Gamer Reviews, url: "https://www.pcgamer.com/feeds/articletype/review/", sections: [gaming],
        kind: reviews, reviews_only: true, score_from_page: true }      # the main feed carries only a few
    - { name: Rock Paper Shotgun, url: "https://www.rockpapershotgun.com/feed", sections: [gaming],
        skip_paths: [-deals-, /deals] }
    - { name: RPS Reviews,   url: "https://www.rockpapershotgun.com/feed/reviews", sections: [gaming], kind: reviews }
    - { name: I Dream of Indie Games, url: "https://www.idreamofindie.com/blog-feed.xml", sections: [gaming], kind: reviews }
    - { name: Eurogamer,     url: "https://www.eurogamer.net/feed/reviews", sections: [gaming], kind: reviews,
        reviews_only: true, multi_platform: true, score_from_page: true }
    - { name: Game Informer, url: "https://gameinformer.com/reviews.xml", sections: [gaming], kind: reviews,
        reviews_only: true, multi_platform: true, score_scale: 10 }
    - { name: PCGamesN,      url: "https://www.pcgamesn.com/mainrss.xml", sections: [gaming], reviews_url: "/review/?$",
        reviews_only: true, score_from_page: true, max_items: 100 }    # 75 items, reviews often near the end
    # GameSpot blocks page fetches and has no scores in its feed; IGN has no working review feed
    # RPS deals (/feed/deals) is mostly hardware and often weeks old; IsThereAnyDeal covers game deals
  google_news:
    - { name: PCMag, query: "pcmag.com when:2d", domain: pcmag.com, sections: [tech, ai], weight: 0.8 }   # direct feed is bot-blocked
  youtube:
    - { name: gameranx,               channel_id: "UCNvzD7Z-g64bPXxGzaQaa4g" }
    - { name: I Dream of Indie Games, channel_id: "UC_HX1n5iojK-xjy9WxfxXhg" }
  steam: { cc: se, lists: [new_releases, coming_soon, specials] }   # popular new · most wishlisted · popular on sale
  itad:                               # needs the ITAD_API_KEY secret; without it deals come from Steam specials
    enabled: true
    sort: rank                        # ITAD popularity; "-cut" (biggest discount first) filled the list with €1 games
    limit: 100
    min_steam_percent: 80
    min_steam_reviews: 500
    info_limit: 25                    # games to look up for ratings and Metascore
    critics: { enabled: true, max_reviewed_games: 40 }   # Gaming: Metascore/OpenCritic, and "is it on PC?"
    hidden:                           # hidden gems: lesser-known (few reviews) but very well rated
      min_steam_percent: 90
      steam_reviews: [200, 5000]
      min_regular: 8                  # normal price in EUR; keeps out the €0.49 shovelware
      limit: 40
      info_limit: 10
    genres:                           # genre picks: each group is any of these Steam tags (ITAD's names)
      min_steam_percent: 85
      steam_reviews: [100, 20000]     # the cap leaves the big names to the popular list
      limit: 30
      info_limit: 5
      tags:
        Horror: [Horror, Psychological Horror, Survival Horror]
        FMV: [FMV]
        Point & Click: [Point & Click]
        Roguelike: [Roguelike, Roguelite, Action Roguelike, Roguelike Deckbuilder, Traditional Roguelike]
        Incremental: [Incremental, Idler, Clicker]

pricing:                              # USD per million tokens (Nov 2026)
  claude-fable-5-1:  { input: 10.00, output: 50.00, cache_read: 0.25, cache_write_5m: 12.50 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_read: 0.20, cache_write_5m: 5.00 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.10, cache_write_5m: 2.50 }
  claude-haiku-5-5:  { input: 0.10, output: 0.50,  cache_read: 0.01, cache_write_5m: 0.125 }
  web_search_per_1000: 10.00
