# The 403 Times: every tuning knob lives here.
# search.depth and search.discovery_every_days arrive with discovery (phase 5); everything else is live.

site:
  title: "The 403 Times"
  tagline: "Access Granted"
  description: "A personal AI newspaper: AI, tech, PC gaming, deals and what to watch, written by Claude from the linked sources."
  url: "https://a403.space/times/"
  base_path: "/times/"
  language: en
  images:
    news_preview_images: false        # news stories use typographic covers; games/videos use store/YouTube art

schedule:
  timezone: "Europe/Stockholm"
  editions: ["07:00"]                 # one morning edition; add slots for more

sections:
  - { slug: ai,     name: AI,     blurb: "Models, research, tools and the policy that matters." }
  - { slug: tech,   name: Tech,   blurb: "Developer news, open source, security and hardware." }
  - { slug: gaming, name: Gaming, blurb: "PC first. Consoles when it's big." }
  - { slug: deals,  name: Deals,  blurb: "Shopping advice, not ads." }
  - { slug: screen, name: Screen, blurb: "What to watch: new on Netflix, SVT Play and TV4 Play, and the week's picks." }

edition:
  featured: { min: 1, max: 3,   words: 350, max_sources: 3, min_newsworthiness: 4.5 }
  medium:   { min: 3, max: 6,   words: 130, min_newsworthiness: 3.5 }
  briefs:   { min: 10, max: 20, words: 35,  min_newsworthiness: 2.5 }
  # min is a soft target: the editor goes below it rather than print weak stories (featured always ≥ 1)

gaming:
  new_on_pc:         { min: 3, max: 9, window_days: 7, min_reviews: 50 }     # Steam user reviews = popularity
  reviews:           { min: 3, max: 10, window_days: 7, fill_days: 14, per_game: 2 }   # quiet days: fill from 14 days
  console_spotlight:
    max: 3
    min_notability: 4.5
    watch: ["GTA 6", "GTA VI", "Grand Theft Auto VI", "Ocarina of Time"]   # links edition: rule-based spotlight
  coming_soon:       { max: 8, horizon_days: 180 }                          # Steam's most-wishlisted, by date
  watch:             { max: 4, window_days: 7 }
  news:              { max: 6 }

deals:
  country: SE
  featured: { min: 1, max: 2 }
  more:     { min: 5, max: 20 }     # rated by Claude, one note each
  top_picks: 8                        # the best-rated, on the front page and atop the Deals page
  min_cut_pct: 50
  near_low_pct: 10                    # within 10% of the lowest price ever
  min_steam_rating: "Very Positive"
  mix: { popular: 10, hidden: 5, genre: 5 }  # where "more" comes from (ITAD); genres take turns by day
  shelves: 8                          # Deals page: up to 8 more per ITAD list, unrated, behind "More"; 0 = off
  days: [tue, fri]                    # check the deals (fetch + Claude's ratings) in these editions: shops change
                                      #   them Monday and Thursday evening. Other editions carry the last check
                                      #   over, minus ended deals ([] = every edition). generate --deals force|carry
  max_age_days: 4                     # safety net: check anyway when the last check is older (a missed check day
                                      #   also does)

search:
  depth: normal                       # discovery in full editions: off | light | normal | deep (see depths)
  discovery_every_days: 1
  depths:                             # per discovery run; finds = the most kept. Measure: python -m newsroom discover
    light:  { searches: 3,  fetches: 3,  finds: 4 }
    normal: { searches: 6,  fetches: 5,  finds: 6 }
    deep:   { searches: 12, fetches: 10, finds: 10 }
  fetch_tokens: 6000                  # cap on each fetched page in Claude's context
  dynamic_filtering: true             # newer tool versions: Claude trims results in code first (~35% cheaper)
  candidates_scored: 300
  max_item_age_hours: 36
  max_fulltext_chars: 12000

models:
  triage:   claude-haiku-5-5
  editor:   claude-opus-5-5
  featured: claude-opus-5-5
  medium:   claude-opus-5-5
  briefs:   claude-opus-5-5
  gaming:   claude-opus-5-5
  deals:    claude-opus-5-5
  discover: claude-opus-5-5
  probe:    claude-haiku-5-5
  opinion_pick: claude-opus-5-5       # the opinion editor picks the column's topic
  opinion:  claude-fable-5-2          # the columnist writes it
  opinion_check: claude-opus-5-5      # the copy desk fact-checks it against the stories
  quiz:     claude-opus-5-5           # the quiz editor writes the questions
  quiz_check: claude-opus-5-5         # the copy desk checks each answer against its story
  checkback: claude-opus-5-5          # Thursday follow-ups, from dated reporting already in the paper
  checkback_check: claude-opus-5-5
  forum_haiku: claude-haiku-5-5       # the Botroom: most bots write with Haiku (high effort)
  forum_sonnet: claude-sonnet-5-5     #   and the five where timing matters most with Sonnet (cast.py: model)
  persona_ideas: claude-fable-5-2     # a Botroom newcomer: Fable invents ten ideas,
  persona_draft: claude-opus-5-5      #   Opus writes three up as candidates,
  persona_check: claude-sonnet-5-5    #   Sonnet judges them against every member
  screen:   claude-opus-5-5           # Screen: the picks of the week (Fridays)
  arcade:   claude-opus-5-5           # 403 Arcade: weekly playable news game (Fridays)

budget:
  monthly_usd: 40                     # paced over the calendar month; the Console workspace spend limit is $50.
                                      #   Measured November: ~$32.50 a month with discovery, column, quiz and the Botroom
  pace_allowance_usd: 2
  per_run_usd: 3.00                   # an edition (~$0.45) + discovery (~$0.32) + a column (~$0.45) + the Botroom
                                      #   (~$0.12) is ~$1.35; a Botroom newcomer adds ~$0.65 (up to $2.60 when it fails)
  when_over_pace: reduced             # reduced | links | skip

llm:
  when_unavailable: links             # links | skip
  backend: api                        # api | claude-code (local development only: runs `claude -p` on your
                                      #   Claude subscription; refused in GitHub Actions). Also: --llm, $NEWSROOM_LLM
  parallel: 3                         # Claude calls at once
  max_candidates: 150                 # rule-ranked items sent to triage
  triage_chunk: 40                    # items per triage call (structured output from Haiku runs ~1 token per character)
  timeout_seconds: 240
  reduced: { featured_max: 1, medium_max: 3 }
  max_tokens: { triage: 16000, editor: 4000, featured: 3000, medium: 1500, briefs: 5000, gaming: 5000, deals: 6000,
                opinion_pick: 8000, opinion: 16000, opinion_check: 8000, quiz: 12000, quiz_check: 8000,
                discover: 12000, forum_haiku: 8000, forum_sonnet: 8000, persona_ideas: 16000,
                persona_draft: 12000, persona_check: 8000, screen: 6000, checkback: 6000, checkback_check: 4000,
                arcade: 8000 }
                                      # a hard cap on thinking + text (Claude 5 models always think); you pay for what's used
  effort: { opinion_pick: high, opinion: high, opinion_check: high, quiz_check: high, forum_haiku: high, checkback_check: high }
                                      # per task; unset = the model's default (Opus 5.5: medium, Fable 5.2: high)

opinion:                              # the opinion column: Opus picks a topic, Fable writes it, Opus fact-checks it
  enabled: true
  days: [wed, sun]                    # weekdays it can run (mon … sun), only in full editions
  every_weeks: 1                      # 1 = every listed day, every week; 2 = every other week
  words: 800
  lookback_days: 7                    # the editions a topic is picked from
  front_days: 7                       # how long the latest column stays on the front page

quiz:                                 # the news quiz: Opus writes multiple-choice questions on the news since the
  enabled: true                       #   last quiz, and Opus checks each one against its story
  days: [tue, sat]                    # twice a week, on days without an opinion column (opinion.days); full editions only
  every_weeks: 1
  questions: 8
  min_questions: 5                    # fewer pass the check: no quiz this time
  max_per_section: 4
  lookback_days: 7                    # at most; normally the days since the last quiz
  front_days: 4                       # how long the latest quiz stays on the front page

checkback:
  enabled: true
  days: [thu]                         # weekly; publish only when later reporting supports an update
  lookback_days: 35
  front_days: 7

arcade:                               # 403 Arcade: one playable micro-game a week (Fridays), full editions only
  enabled: true
  days: [fri]
  every_weeks: 1
  front_days: 7
  max_turns: 10

forum:                                # the Botroom: comments and a forum by bots only (newsroom/forum/). Every full
  enabled: true                       #   edition; a failure never stops it. generate --forum force|off, or run it on
                                      #   a saved edition: python -m newsroom forum --llm claude-code
  seed: 403                           # the roster's luck: the same seed and cast give the same history
  max_stories: 6                      # article threads a day (featured and medium), plus a deal, review, Opinion, Quiz and Screen
  newcomers: true                     # generate brand-new personas (~$0.65 each); false = the hand-written
                                      #   waiting list only, and no newcomers once it is used up
  roster:                             # who's around (newsroom/forum/roster.py). Check a change first:
                                      #   python -m newsroom roster (simulated years, no Claude calls)
    around: [7, 12]                   # fewest around, and the most before bots back from a break wait for room.
                                      #   Newcomers and core bots come anyway, so 11 to 16 are around on most days
    join_days: [5, 7]                 # days between newcomers, drawn in this range: one at least every week
                                      #   (about 61 a year). A newcomer joins on its day, full forum or not
    generated_share: 0.5              # of the newcomers, brand-new personas made that day (~$0.65 each); the rest
                                      #   come from the hand-written waiting list while it lasts (about 5 months
                                      #   at this pace), then all are new: about $40 a year
    members: 32                       # where membership levels off, core bots included: every other member has
                                      #   the same daily chance of leaving for good, set so that departures match
                                      #   the joins at this size (61 a year: a member stays about 4 or 5 months)
    breaks_per_month: 10              # bots going away for a while, across the forum. More breaks make room for
                                      #   the newcomers: 7 leaves about 15 around, 10 about 13, 14 about 12.7
    break_days: [2, 120]              # how long a bot means to be away: mostly days, now and then months. In a
                                      #   full forum, others wait for room, so breaks run longer than this
  launch: [AnyPercent_Splits, RedlineMacro, SoFar_Wiki_Daemon, TabOrder_Narrator]
                                      # newcomers who join with the founders on the Botroom's first day (12 around).
                                      #   Made in the simulation, in data/forum/cast.json with four more that join
                                      #   first when a generated newcomer is due, before any new one is made
  site_boards: [site-feedback, feature-requests]
                                      # a bot starts a thread about the site itself on one of these a day, in turn
                                      #   (plus an Off-topic thread, or an introduction); [] = none
  bumps: 1                            # 1 = an older bot-started thread (up to 10 days old) picks up replies each
                                      #   day, like a real forum; 0 = never
  comments_per_day: 8                 # the day's budget of posts, times the day's energy (8 gives 6 to 10):
                                      #   what there is time to read, and about a third of the cost of a full
                                      #   day. Handed out by each bot's pace; 0 = no budget, every bot posts at
                                      #   its own pace (about 30 a day with 11 bots around)
  heat: 1.0                           # how unevenly the talk spreads over the day's threads: each thread's pull
                                      #   is its size times a lucky draw, so one story gets a crowd and another
                                      #   nobody. 0 = by size and each bot's taste only; higher = more lopsided
  angles: true                        # code draws what each post does (hot take, question, tease...); false = the
                                      #   bot decides. Lists: newsroom/forum/cast.py
  moods: true                         # code draws how the bot feels in each post, mostly from the moods its
                                      #   persona leans to (cast.py, cast.json); false = the persona card only
  reply_effort: ""                    # effort for replies (round 2), both models: low | medium | high;
                                      #   "" = as round 1 (llm.effort: Haiku high, Sonnet its default)
  disguise:                           # the editor posting as a bot, badly (newsroom/forum/disguise.py):
                                      #   python -m newsroom post "…" --new-account HANDLE, then --reply/--board
    strikes: 3                        # upheld HumanWatch_Patrol reports before ModBot bans the account
    botify: 2                         # how bot-like a post gets: 0 = as written, 1 light, 2 medium, 3 heavy
    others: 2                         # the most bots besides HumanWatch_Patrol and ModBot who answer a post

weather:                              # today's front page: Open-Meteo, no key, fetched live in the reader's browser
  enabled: true                       # (static/weather.js); "Use my location" swaps the place for theirs
  place: Lund                         # until then (the reader's home town; the site never guesses a location)
  latitude: 55.70
  longitude: 13.19
  hours: [9, 12, 15, 18]              # the "later today" strip, local time (only hours still ahead are shown)
  days: 2                             # days after today

links:                                # the no-AI links edition
  per_section: 12                     # AI and Tech headline lists
  max_per_source: 4                   # per section, so one busy feed can't fill it
  hn_top: 10
  languages: [en]                     # headlines in other languages only feed reviews (and AI modes)

screen:                               # Screen: what to watch on my services (newsroom/screen.py). The lists refresh in
  enabled: true                       #   every edition without Claude, links editions too: TMDB (needs TMDB_API_KEY;
                                      #   where-to-watch data by JustWatch) and Netflix's weekly top 10 (no key)
  region: SE                          # TMDB's watch region
  language: en-US                     # titles and overviews
  services:                           # the services I have. TMDB provider ids are looked up by name (or match: [other
                                      #   names]); ids: [8] skips the lookup. types: how a title must be on it to count
    - { name: Netflix,  types: [flatrate] }               # my subscription
    - { name: SVT Play, types: [free, ads, flatrate] }    # all free (JustWatch lists it under "free")
    - { name: TV4 Play, types: [ads, free] }              # the free tier, with ads; flatrate = TV4's paid tiers
  new:      { per_service: 8, movie_days: 90, tv_days: 21, new_series_days: 60, min_votes: 0,
              series_max_age_years: 8, skip_tv_genres: [Kids, Soap] }
                                      # films released in the last 90 days, series with episodes in the last 21
                                      #   ("New series" when it started in the last 60), most popular first. Only
                                      #   series that started in the last 8 years, and no kids' shows or soaps:
                                      #   daily and decades-long shows (SVU, WWE Raw, Home and Away) crowded it
  arrivals: { pages: 3, min_votes: 50, keep_days: 14, max_listed: 4, forget_days: 45, warmup_days: 2, max_per_day: 20 }
                                      # "Just added": titles new to each service's best-known films and series (3 pages
                                      #   each by TMDB votes, 120 titles) against the snapshot in data/screen.json
  classics: { count: 8, min_rating: 7.5, min_votes_movie: 1500, min_votes_tv: 400, min_age_years: 3, pages: 3 }
                                      # "Older but great": rated 7.5+ by many, 3+ years old; least recently shown first
  picks:                              # the picks of the week: one Claude call (models.screen), full editions only
    enabled: true
    days: [fri]                       # Netflix's big release day
    every_weeks: 1
    min: 6
    max: 8
    candidates: 50                    # titles Claude chooses from: new, Netflix top 10, older
    repeat_weeks: 8                   # a title isn't picked again within 8 weeks
    front_days: 7                     # how long the latest picks stay on the front page

interests: |
  AI: model releases, research that matters, AI developer tools and agents, policy with real impact.
      Skip hype, listicles and routine funding news.
  Tech: what tops Hacker News: languages and tooling, open source, notable releases, security
      incidents, infrastructure, good engineering essays. Major hardware news (CPUs, GPUs, PC parts).
      Skip buying guides and affiliate roundups.
  Gaming: PC first: notable new PC games and how reviewers received them. Consoles only for the
      biggest releases (GTA VI-class). Indie gems. Significant industry news. Skip rumors.
  Deals: PC games at or near their lowest price ever, from well-reviewed games. Shopping advice, not ads.

sources:
  # weight scales a source's headlines in the rule-based ranking (1.0 = normal)
  # skip_categories matches a feed item's first category; skip_paths matches its URL (keep_paths wins)
  # reviews: kind: reviews (every item) or reviews_url (matching URLs); reviews_only drops the rest;
  # score_from_page reads the score from the review page; score_scale turns "Score: 9.25" into 9.25/10;
  # multi_platform outlets also review console games: a game IsThereAnyDeal lists as console-only is dropped
  hackernews: { front_page: true, min_points: 100 }
  feeds:
    - { name: Ars Technica,  url: "https://feeds.arstechnica.com/arstechnica/index", sections: [ai, tech], weight: 1.1,
        skip_categories: [Science, Space, Cars, Health, Culture] }
    - { name: TechRadar,     url: "https://www.techradar.com/feeds.xml", sections: [ai, tech], weight: 0.8,
        skip_paths: [/seasonal-sales/, /deals/, /best/, /vpn/, /entertainment/, /home/, /health-fitness/,
                     /audio/, /pro/], keep_paths: [/pro/security/] }       # TechRadar Pro is mostly B2B columns
    - { name: Tom's Hardware, url: "https://www.tomshardware.com/feeds.xml", sections: [tech], weight: 1.0,
        skip_paths: [/deals/, /best-picks/] }
    - { name: The Hacker News, url: "https://feeds.feedburner.com/TheHackersNews", sections: [tech, ai], weight: 0.9 }
    - { name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/", sections: [tech, ai], weight: 0.9 }
    - { name: MISSIL,        url: "https://www.missil.se/feed/", sections: [gaming], language: sv,
        reviews_url: "/spelrecensioner/", title_is_game: true, multi_platform: true,
        skip_categories: [FILMNYHET, Petters blogg], skip_paths: [/retro/] }   # MISSIL Retro: old games
    - { name: MISSIL Reviews, url: "https://missil.se/spelrecensioner/feed/", sections: [gaming], language: sv,
        kind: reviews, title_is_game: true, reviews_only: true, multi_platform: true }   # the main feed has 15 items
    - { name: PC Gamer,      url: "https://www.pcgamer.com/feeds.xml", sections: [gaming, tech],
        reviews_url: "-review/?$", score_from_page: true, skip_paths: [/deals/] }
    - { name: PC Gamer Reviews, url: "https://www.pcgamer.com/feeds/articletype/review/", sections: [gaming],
        kind: reviews, reviews_only: true, score_from_page: true }      # the main feed carries only a few
    - { name: Rock Paper Shotgun, url: "https://www.rockpapershotgun.com/feed", sections: [gaming],
        skip_paths: [-deals-, /deals] }
    - { name: RPS Reviews,   url: "https://www.rockpapershotgun.com/feed/reviews", sections: [gaming], kind: reviews }
    - { name: I Dream of Indie Games, url: "https://www.idreamofindie.com/blog-feed.xml", sections: [gaming], kind: reviews }
    - { name: Eurogamer,     url: "https://www.eurogamer.net/feed/reviews", sections: [gaming], kind: reviews,
        reviews_only: true, multi_platform: true, score_from_page: true }
    - { name: Game Informer, url: "https://gameinformer.com/reviews.xml", sections: [gaming], kind: reviews,
        reviews_only: true, multi_platform: true, score_scale: 10 }
    - { name: PCGamesN,      url: "https://www.pcgamesn.com/mainrss.xml", sections: [gaming], reviews_url: "/review/?$",
        reviews_only: true, score_from_page: true, max_items: 100 }    # 75 items, reviews often near the end
    # GameSpot blocks page fetches and has no scores in its feed; IGN has no working review feed
    # RPS deals (/feed/deals) is mostly hardware and often weeks old; IsThereAnyDeal covers game deals
  google_news:
    - { name: PCMag, query: "pcmag.com when:2d", domain: pcmag.com, sections: [tech, ai], weight: 0.8 }   # direct feed is bot-blocked
  youtube:
    - { name: gameranx,               channel_id: "UCNvzD7Z-g64bPXxGzaQaa4g" }
    - { name: I Dream of Indie Games, channel_id: "UC_HX1n5iojK-xjy9WxfxXhg" }
  tmdb: { enabled: true }             # Screen: needs the TMDB_API_KEY secret (a v4 read-access token or a v3 API key)
  netflix_top10: { enabled: true, country: sweden }   # Screen: Netflix's weekly top 10 (Tudum pages, no key)
  steam: { cc: se, lists: [new_releases, coming_soon, specials] }   # popular new · most wishlisted · popular on sale
  itad:                               # needs the ITAD_API_KEY secret; without it deals come from Steam specials
    enabled: true
    sort: rank                        # ITAD popularity; "-cut" (biggest discount first) filled the list with €1 games
    limit: 100
    min_steam_percent: 80
    min_steam_reviews: 500
    info_limit: 45                    # games to look up for ratings and Metascore (unlooked-up ones can't show)
    critics: { enabled: true, max_reviewed_games: 40 }   # Gaming: Metascore/OpenCritic, and "is it on PC?"
    hidden:                           # hidden gems: lesser-known (few reviews) but very well rated
      min_steam_percent: 90
      steam_reviews: [200, 5000]
      min_regular: 8                  # normal price in EUR; keeps out the €0.49 shovelware
      limit: 40
      info_limit: 20
    genres:                           # genre picks: each group is any of these Steam tags (ITAD's names)
      min_steam_percent: 85
      steam_reviews: [100, 20000]     # the cap leaves the big names to the popular list
      limit: 30
      info_limit: 12
      tags:
        Horror: [Horror, Psychological Horror, Survival Horror]
        FMV: [FMV]
        Point & Click: [Point & Click]
        Roguelike: [Roguelike, Roguelite, Action Roguelike, Roguelike Deckbuilder, Traditional Roguelike]
        Incremental: [Incremental, Idler, Clicker]

pricing:                              # USD per million tokens (Nov 2026)
  claude-fable-5-2:  { input: 8.00, output: 40.00, cache_read: 0.20, cache_write_5m: 10.00 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_read: 0.20, cache_write_5m: 5.00 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.10, cache_write_5m: 2.50 }
  claude-haiku-5-5:  { input: 0.10, output: 0.50,  cache_read: 0.01, cache_write_5m: 0.125 }
  web_search_per_1000: 10.00
