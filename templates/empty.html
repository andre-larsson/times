{% extends "base.html" %}

{% block title %}{{ site.title }} · {{ site.tagline }}{% endblock %}

{% block main %}
<div class="wrap not-found">
  <p class="not-found-code" aria-hidden="true">403</p>
  <h1 class="hl hl-lg">The presses are warming up.</h1>
  <p>The first edition of {{ site.title }} is on its way. New editions appear every morning at {{ edition_time }} (Stockholm time).</p>
</div>
{% endblock %}
